<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulario de registro</title>
</head>
<body>
 
  <header>
    <h1>Formulario de registro</h1>
  </header>
 
  <main>
    <form action="#" method="post">
 
      <p>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
      </p>
 
      <p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="correo@ejemplo.com">
      </p>
 
      <p>
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" minlength="6">
      </p>
 
      <p>
        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" placeholder="Mínimo 18" min="18">
      </p>
 
      <fieldset>
        <legend>Género</legend>
 
        <input type="radio" id="femenino" name="genero" value="femenino">
        <label for="femenino">Femenino</label>
 
        <input type="radio" id="masculino" name="genero" value="masculino">
        <label for="masculino">Masculino</label>
 
        <input type="radio" id="otro" name="genero" value="otro">
        <label for="otro">Otro</label>
      </fieldset>
 
      <p>
        <label for="pais">País:</label>
        <select id="pais" name="pais">
          <option value="" disabled selected>Selecciona tu país</option>
          <option value="colombia">Colombia</option>
          <option value="mexico">México</option>
          <option value="argentina">Argentina</option>
          <option value="espana">España</option>
        </select>
      </p>
 
      <fieldset>
        <legend>Términos y condiciones</legend>
 
        <input type="checkbox" id="terminos" name="terminos" required>
        <label for="terminos">Acepto los términos y condiciones</label>
      </fieldset>
 
      <p>
        <label for="comentario">Comentario:</label><br>
        <textarea id="comentario" name="comentario" rows="5" cols="40" placeholder="Escribe aquí tu comentario"></textarea>
      </p>
 
      <p>
        <button type="submit">Enviar</button>
        <button type="reset">Limpiar</button>
      </p>
 
    </form>
  </main>
 
</body>
</html>
